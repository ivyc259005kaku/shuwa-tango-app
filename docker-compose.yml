version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shuwa-tango-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - shuwa-network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: shuwa-tango-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shuwa-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: shuwa-tango-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shuwa_tango
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - shuwa-network

networks:
  shuwa-network:
    driver: bridge

volumes:
  db-data:
